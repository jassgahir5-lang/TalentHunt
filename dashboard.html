<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - TalentHunt</title>
    <meta name="description" content="TalentHunt Role-Based Dashboard." />
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <!-- Chart.js 4 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-body-tertiary">
    <!-- Navbar Container -->
    <div id="main-navbar"></div>

    <main class="py-4 py-lg-5">
      <div class="container-xl">
        <!-- Header Banner with Welcome & Actions -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <div class="d-flex align-items-center gap-2">
              <h1 class="h2 fw-bold mb-0" id="dash-greeting">Welcome back!</h1>
              <span id="dash-role-badge"></span>
            </div>
            <p class="text-secondary mb-0 small mt-1" id="dash-subtitle">Here is your operational overview for today.</p>
          </div>
          <div class="d-flex align-items-center gap-2" id="dash-header-actions">
            <!-- Dynamic Actions -->
          </div>
        </div>

        <!-- Role Container: Admin, Judge, or Participant -->
        <div id="dashboard-content">
          <!-- Loading skeleton -->
          <div class="row g-4 mb-4">
            <div class="col-sm-6 col-lg-3"><div class="card card-th p-4"><div class="skeleton-line mb-2" style="width: 40%"></div><div class="skeleton-line" style="width: 70%; height: 28px;"></div></div></div>
            <div class="col-sm-6 col-lg-3"><div class="card card-th p-4"><div class="skeleton-line mb-2" style="width: 40%"></div><div class="skeleton-line" style="width: 70%; height: 28px;"></div></div></div>
            <div class="col-sm-6 col-lg-3"><div class="card card-th p-4"><div class="skeleton-line mb-2" style="width: 40%"></div><div class="skeleton-line" style="width: 70%; height: 28px;"></div></div></div>
            <div class="col-sm-6 col-lg-3"><div class="card card-th p-4"><div class="skeleton-line mb-2" style="width: 40%"></div><div class="skeleton-line" style="width: 70%; height: 28px;"></div></div></div>
          </div>
        </div>

        <!-- Announcements Board Section (Common to all roles) -->
        <div class="card card-th-static mt-4 p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-megaphone-fill text-warning fs-4"></i>
              <h4 class="h5 fw-bold mb-0">Platform Bulletins & Notices</h4>
            </div>
            <span class="badge bg-secondary-subtle text-secondary small">Live Feed</span>
          </div>
          <div id="dash-announcements" class="d-flex flex-column gap-3">
            <div class="skeleton-line" style="width: 100%;"></div>
            <div class="skeleton-line" style="width: 80%;"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Post Announcement Modal (Admin only) -->
    <div class="modal fade" id="announcement-modal" tabindex="-1" aria-labelledby="annModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content card-th-static">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="annModalLabel">
              <i class="bi bi-megaphone-fill text-warning me-2"></i>Post New Announcement
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="announcement-form" novalidate>
            <div class="modal-body">
              <div class="mb-3">
                <label for="ann-title" class="form-label small fw-semibold">Title</label>
                <input type="text" class="form-control" id="ann-title" placeholder="e.g. Schedule Update for Coding Sprint" required />
                <div class="invalid-feedback">Title is required.</div>
              </div>
              <div class="mb-3">
                <label for="ann-content" class="form-label small fw-semibold">Content</label>
                <textarea class="form-control" id="ann-content" rows="4" placeholder="Announcement details..." required></textarea>
                <div class="invalid-feedback">Content is required.</div>
              </div>
              <div class="mb-3">
                <label for="ann-priority" class="form-label small fw-semibold">Priority</label>
                <select class="form-select" id="ann-priority">
                  <option value="normal">Normal Bulletin</option>
                  <option value="high">Urgent / High Priority</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-th-primary" id="ann-submit-btn">Publish Announcement</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="th-footer mt-auto">
      <div class="container-xl text-center">
        <p class="mb-0 small text-secondary">TalentHunt &copy; 2026. Online Talent Hunt and Competition Management Platform.</p>
      </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core App JS -->
    <script src="/js/app.js"></script>
    <script>
      let barChartInstance = null;
      let doughnutChartInstance = null;

      onReady(async () => {
        if (!requireLogin()) return;
        renderNav('dashboard');

        const user = getCurrentUser();
        document.getElementById('dash-greeting').textContent = `Welcome back, ${user.name}!`;

        const roleBadge = document.getElementById('dash-role-badge');
        const rClass = user.role === 'admin' ? 'badge-role-admin' :
                       user.role === 'judge' ? 'badge-role-judge' : 'badge-role-participant';
        roleBadge.className = `badge ${rClass} text-uppercase px-2 py-1`;
        roleBadge.textContent = user.role;

        const headerActions = document.getElementById('dash-header-actions');
        if (user.role === 'admin') {
          headerActions.innerHTML = `
            <button class="btn btn-outline-primary fw-semibold btn-sm d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#announcement-modal">
              <i class="bi bi-megaphone"></i> Post Announcement
            </button>
            <a href="competitions.html" class="btn btn-th-primary fw-semibold btn-sm d-flex align-items-center gap-1">
              <i class="bi bi-plus-circle"></i> Manage Events
            </a>
          `;
        } else if (user.role === 'judge') {
          headerActions.innerHTML = `
            <a href="entries.html" class="btn btn-th-primary fw-semibold btn-sm d-flex align-items-center gap-1">
              <i class="bi bi-sliders"></i> Go to Judging Panel
            </a>
          `;
        } else {
          headerActions.innerHTML = `
            <a href="competitions.html" class="btn btn-outline-primary fw-semibold btn-sm d-flex align-items-center gap-1">
              <i class="bi bi-trophy"></i> Explore Competitions
            </a>
            <a href="entries.html" class="btn btn-th-primary fw-semibold btn-sm d-flex align-items-center gap-1">
              <i class="bi bi-folder2-open"></i> My Entries
            </a>
          `;
        }

        // Fetch Dashboard Data
        try {
          const data = await api('/dashboard');
          renderDashboard(data, user);
          renderAnnouncements(data.announcements);
        } catch (err) {
          showToast((err && err.message) || 'Error loading dashboard data', 'danger');
        }

        // Handle Announcement Form Submission (Admin only)
        const annForm = document.getElementById('announcement-form');
        const annSubmitBtn = document.getElementById('ann-submit-btn');
        if (annForm) {
          annForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearInvalid(annForm);

            const titleInput = document.getElementById('ann-title');
            const contentInput = document.getElementById('ann-content');
            const priorityInput = document.getElementById('ann-priority');

            let hasErr = false;
            if (!titleInput.value.trim()) {
              markInvalid(titleInput, 'Title is required');
              hasErr = true;
            }
            if (!contentInput.value.trim()) {
              markInvalid(contentInput, 'Content is required');
              hasErr = true;
            }
            if (hasErr) return;

            setBtnLoading(annSubmitBtn, true);

            try {
              await api('/announcements', 'POST', {
                title: titleInput.value.trim(),
                content: contentInput.value.trim(),
                priority: priorityInput.value
              });

              setBtnLoading(annSubmitBtn, false);
              bootstrap.Modal.getInstance(document.getElementById('announcement-modal')).hide();
              annForm.reset();
              showToast('Announcement published successfully!', 'success');

              // Refresh dashboard announcements
              const freshData = await api('/dashboard');
              renderAnnouncements(freshData.announcements);
            } catch (err) {
              setBtnLoading(annSubmitBtn, false);
              showToast((err && err.message) || 'Error publishing announcement', 'danger');
            }
          });
        }
      });

      function renderDashboard(data, user) {
        const container = document.getElementById('dashboard-content');

        if (user.role === 'admin') {
          const stats = data.stats || {};
          container.innerHTML = `
            <!-- Admin Stat Cards (6 stats) -->
            <div class="row g-3 g-xl-4 mb-4">
              <div class="col-sm-6 col-lg-4 col-xl-2">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-primary-subtle text-primary">
                    <i class="bi bi-people-fill"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Participants</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.participants || 0}</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-4 col-xl-2">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-purple-subtle" style="background-color: #ede9fe; color: #7c3aed;">
                    <i class="bi bi-award-fill"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Judges</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.judges || 0}</div>
                    <div class="text-warning small" style="font-size: 0.72rem;">${stats.pendingJudges || 0} pending</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-4 col-xl-2">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-warning-subtle text-warning">
                    <i class="bi bi-trophy-fill"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Competitions</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.competitions || 0}</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-4 col-xl-2">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-info-subtle text-info">
                    <i class="bi bi-check2-square"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Registrations</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.registrations || 0}</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-4 col-xl-2">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-success-subtle text-success">
                    <i class="bi bi-folder-check"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Entries</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.entries || 0}</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-4 col-xl-2">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-danger-subtle text-danger">
                    <i class="bi bi-stars"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Evaluations</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.scores || 0}</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Charts Row -->
            <div class="row g-4 mb-4">
              <div class="col-lg-8">
                <div class="card card-th-static h-100 p-4">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Registrations vs Submissions per Event</h5>
                    <span class="badge bg-light text-secondary border small">Comparison</span>
                  </div>
                  <div style="position: relative; height: 300px;">
                    <canvas id="adminBarChart"></canvas>
                  </div>
                </div>
              </div>
              <div class="col-lg-4">
                <div class="card card-th-static h-100 p-4">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Participation by Category</h5>
                    <span class="badge bg-light text-secondary border small">Distribution</span>
                  </div>
                  <div style="position: relative; height: 300px;">
                    <canvas id="adminDoughnutChart"></canvas>
                  </div>
                </div>
              </div>
            </div>
          `;

          // Render Chart.js
          setTimeout(() => {
            const barCtx = document.getElementById('adminBarChart')?.getContext('2d');
            const doughnutCtx = document.getElementById('adminDoughnutChart')?.getContext('2d');

            if (barCtx && data.chartData?.bar) {
              barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                  labels: data.chartData.bar.labels,
                  datasets: [
                    {
                      label: 'Registrations',
                      data: data.chartData.bar.registrations,
                      backgroundColor: '#4f46e5',
                      borderRadius: 6
                    },
                    {
                      label: 'Entries Submitted',
                      data: data.chartData.bar.entries,
                      backgroundColor: '#10b981',
                      borderRadius: 6
                    }
                  ]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: { position: 'bottom' }
                  },
                  scales: {
                    y: { beginAtZero: true, ticks: { precision: 0 } }
                  }
                }
              });
            }

            if (doughnutCtx && data.chartData?.doughnut) {
              const bgColors = ['#ec4899', '#f97316', '#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#06b6d4'];
              doughnutChartInstance = new Chart(doughnutCtx, {
                type: 'doughnut',
                data: {
                  labels: data.chartData.doughnut.labels.length ? data.chartData.doughnut.labels : ['No Registrations'],
                  datasets: [{
                    data: data.chartData.doughnut.data.length ? data.chartData.doughnut.data : [1],
                    backgroundColor: bgColors.slice(0, data.chartData.doughnut.labels.length || 1),
                    hoverOffset: 6
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: { position: 'bottom' }
                  }
                }
              });
            }
          }, 50);

        } else if (user.role === 'judge') {
          const stats = data.stats || {};
          container.innerHTML = `
            <!-- Judge Stat Cards -->
            <div class="row g-3 g-lg-4 mb-4">
              <div class="col-sm-6 col-lg-3">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-primary-subtle text-primary">
                    <i class="bi bi-trophy-fill"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Assigned Events</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.assignedCompetitions || 0}</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-3">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-info-subtle text-info">
                    <i class="bi bi-collection-fill"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Entries to Review</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.totalEntriesToJudge || 0}</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-3">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-success-subtle text-success">
                    <i class="bi bi-check-circle-fill"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Entries Scored</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.scoredEntries || 0}</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-3">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-warning-subtle text-warning">
                    <i class="bi bi-hourglass-split"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Pending Reviews</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.pendingReviews || 0}</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Stacked Bar Chart (Scored vs Waiting) -->
            <div class="card card-th-static p-4 mb-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                  <h5 class="fw-bold mb-1">Judging Progress Across Assigned Events</h5>
                  <p class="text-secondary small mb-0">Breakdown of evaluated entries versus awaiting your scoring.</p>
                </div>
                <a href="entries.html" class="btn btn-outline-primary btn-sm fw-semibold">
                  Open Judge Scoring Panel <i class="bi bi-arrow-right ms-1"></i>
                </a>
              </div>
              <div style="position: relative; height: 320px;">
                <canvas id="judgeStackedChart"></canvas>
              </div>
            </div>
          `;

          setTimeout(() => {
            const stackedCtx = document.getElementById('judgeStackedChart')?.getContext('2d');
            if (stackedCtx && data.chartData?.stackedBar) {
              new Chart(stackedCtx, {
                type: 'bar',
                data: {
                  labels: data.chartData.stackedBar.labels.length ? data.chartData.stackedBar.labels : ['No Assigned Events'],
                  datasets: [
                    {
                      label: 'Scored by You',
                      data: data.chartData.stackedBar.scored.length ? data.chartData.stackedBar.scored : [0],
                      backgroundColor: '#10b981',
                      borderRadius: 4
                    },
                    {
                      label: 'Awaiting Your Review',
                      data: data.chartData.stackedBar.waiting.length ? data.chartData.stackedBar.waiting : [0],
                      backgroundColor: '#f59e0b',
                      borderRadius: 4
                    }
                  ]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  scales: {
                    x: { stacked: true },
                    y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } }
                  },
                  plugins: {
                    legend: { position: 'bottom' }
                  }
                }
              });
            }
          }, 50);

        } else {
          // Participant Dashboard
          const stats = data.stats || {};
          const resultsList = data.resultsList || [];

          let resultsTableHtml = '';
          if (resultsList.length === 0) {
            resultsTableHtml = `
              <tr>
                <td colspan="5" class="text-center py-4 text-secondary">
                  <i class="bi bi-inbox fs-3 d-block mb-1"></i>
                  No submitted entries yet. Register for an event to get started!
                </td>
              </tr>
            `;
          } else {
            resultsTableHtml = resultsList.map(r => `
              <tr>
                <td class="fw-semibold">${esc(r.competitionTitle)}</td>
                <td>${esc(r.entryTitle)}</td>
                <td>
                  <span class="badge ${r.status === 'Published' ? 'badge-status-published' : 'badge-status-open'}">
                    ${esc(r.status)}
                  </span>
                </td>
                <td class="fw-bold">${r.averageScore ? r.averageScore + ' / 30' : 'Pending'}</td>
                <td>
                  ${r.rank === 'Provisional' ? '<span class="badge bg-secondary-subtle text-secondary">Provisional</span>' : `<span class="badge bg-success-subtle text-success fw-bold fs-6">${esc(r.rank)}</span>`}
                </td>
              </tr>
            `).join('');
          }

          container.innerHTML = `
            <!-- Participant Stat Cards -->
            <div class="row g-3 g-lg-4 mb-4">
              <div class="col-sm-6 col-lg-3">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-primary-subtle text-primary">
                    <i class="bi bi-bookmark-check-fill"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Registered Events</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.registeredCompetitions || 0}</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-3">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-success-subtle text-success">
                    <i class="bi bi-cloud-arrow-up-fill"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Entries Submitted</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.entriesSubmitted || 0}</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-3">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-warning-subtle text-warning">
                    <i class="bi bi-clock-history"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Pending Submission</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.pendingSubmissions || 0}</div>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-lg-3">
                <div class="stat-card h-100">
                  <div class="stat-icon-wrapper bg-danger-subtle text-danger">
                    <i class="bi bi-award-fill"></i>
                  </div>
                  <div>
                    <div class="text-secondary small fw-medium">Published Results</div>
                    <div class="fs-4 fw-bold text-body-emphasis">${stats.completedResults || 0}</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Participant Submission Status & Results -->
            <div class="row g-4 mb-4">
              <div class="col-lg-4">
                <div class="card card-th-static h-100 p-4">
                  <h5 class="fw-bold mb-3">Submission Status</h5>
                  <div style="position: relative; height: 240px;">
                    <canvas id="participantDoughnutChart"></canvas>
                  </div>
                  <div class="text-center mt-3">
                    <a href="entries.html" class="btn btn-outline-primary btn-sm fw-semibold">
                      Manage My Entries <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                  </div>
                </div>
              </div>

              <div class="col-lg-8">
                <div class="card card-th-static h-100 p-4">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">My Performance & Final Standings</h5>
                    <a href="competitions.html" class="small text-decoration-none fw-semibold">Browse more</a>
                  </div>
                  <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                      <thead class="table-light">
                        <tr class="small text-secondary">
                          <th>Competition</th>
                          <th>Entry Title</th>
                          <th>Status</th>
                          <th>Avg Score</th>
                          <th>Final Rank</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${resultsTableHtml}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          `;

          setTimeout(() => {
            const pCtx = document.getElementById('participantDoughnutChart')?.getContext('2d');
            if (pCtx && data.chartData?.doughnut) {
              new Chart(pCtx, {
                type: 'doughnut',
                data: {
                  labels: data.chartData.doughnut.labels,
                  datasets: [{
                    data: data.chartData.doughnut.data,
                    backgroundColor: ['#10b981', '#f59e0b'],
                    hoverOffset: 6
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: { position: 'bottom' }
                  }
                }
              });
            }
          }, 50);
        }
      }

      function renderAnnouncements(announcements) {
        const container = document.getElementById('dash-announcements');
        if (!announcements || announcements.length === 0) {
          container.innerHTML = `
            <div class="text-center py-4 text-secondary">
              <p class="mb-0">No active announcements currently posted.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = announcements.map(a => {
          const isHigh = a.priority === 'high';
          return `
            <div class="p-3 rounded-3 border ${isHigh ? 'border-danger bg-danger-subtle bg-opacity-10' : 'bg-body-secondary'}">
              <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                <div class="d-flex align-items-center gap-2">
                  ${isHigh ? '<span class="badge bg-danger">Urgent</span>' : '<span class="badge bg-secondary-subtle text-secondary">Notice</span>'}
                  <h6 class="fw-bold mb-0">${esc(a.title)}</h6>
                </div>
                <span class="text-secondary small" style="font-size: 0.75rem;">${formatDateTime(a.createdAt)}</span>
              </div>
              <p class="small text-secondary mb-1">${esc(a.content)}</p>
              <div class="text-muted small" style="font-size: 0.72rem;">
                <i class="bi bi-person me-1"></i>${esc(a.authorName)}
              </div>
            </div>
          `;
        }).join('');
      }
    </script>
  </body>
</html>
